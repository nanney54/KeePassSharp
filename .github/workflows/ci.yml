name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 11.0.100

      - name: Restore dependencies
        run: dotnet restore KeePassSharp.slnx

      - name: Build
        run: dotnet build KeePassSharp.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test KeePassSharp.slnx --configuration Release --no-build --no-restore
